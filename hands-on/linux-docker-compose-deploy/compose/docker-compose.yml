name: lab-compose

services:
  redis:
    image: redis:7-alpine
    container_name: lab-compose-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: lab-compose-web
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: lab-compose-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  redis_data:
    name: lab_compose_redis_data
